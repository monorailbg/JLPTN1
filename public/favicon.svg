<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Warm paper grain overlay -->
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
    <!-- Subtle inner glow on text -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feFlood flood-color="#ffd080" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Radial warm highlight (no glass, just tonal depth) -->
    <radialGradient id="bg" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c94030"/>
      <stop offset="100%" stop-color="#8c2218"/>
    </radialGradient>
    <!-- Subtle bottom edge shadow -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </linearGradient>
  </defs>

  <!-- Background square — iOS-style proportional rounded corner (rx ≈ 13.5% of 64 = 8.6) -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Tonal overlay for depth -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#edge)"/>
  <!-- Very fine top-left highlight stroke for crafted feel -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5" ry="13.5"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- The kanji 叡 — wisdom / sagacity (叡智, 叡覧) — 16 strokes, N1 -->
  <!-- Placed at visual center with slight upward offset for optical balance -->
  <text
    x="32" y="46"
    font-family="'Noto Serif JP', 'Hiragino Mincho Pro', 'Yu Mincho', 'MS Mincho', serif"
    font-size="38"
    font-weight="700"
    text-anchor="middle"
    fill="rgba(255,255,255,0.95)"
    filter="url(#glow)"
    letter-spacing="-1"
  >叡</text>
</svg>
